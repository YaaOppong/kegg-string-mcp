name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The page is generated from the same sources the library uses, never
      # committed, so a stale copy cannot drift from the validator it shows.
      - name: Generate the static build
        run: python demo/build_pages.py
      - name: Check the generated page carries the runs and the failure marker
        run: |
          test -s docs/index.html
          grep -q 'runs/furA.json' docs/index.html
          grep -q 'browser_api' docs/index.html
          grep -q 'caught a bad citation' docs/index.html
          # Bare Pyodide only: a package install is what broke the first attempt.
          ! grep -q 'micropip.install' docs/index.html
          ! grep -q 'loadPackage' docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
