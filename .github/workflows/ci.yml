name: CI

on:
  push:
  pull_request:

# The test suite never touches the network, so CI needs no secrets and cannot
# fail because an upstream service is down. Fixtures replay real KEGG, STRING,
# PubMed and UniProt responses captured from the live APIs.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Verifies the requires-python = ">=3.10" claim in pyproject.toml, which
        # was previously asserted but never tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Prove the suite is hermetic
        # The suite is meant never to touch the network. Re-run it with all HTTP
        # traffic pointed at a dead port: a test that quietly grew a real request
        # fails here rather than becoming flaky months later.
        run: pytest -q
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  demo:
    # The demo replays committed fixtures and re-validates them, so it breaks the
    # moment the validator changes shape. Building it on every push means the
    # public page cannot drift from the library it demonstrates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,demo]"
      - name: Replay every demo run and build the page
        run: pytest -q tests/test_app.py

  vector:
    # The retrieval arm is an optional extra, so it gets its own job rather than
    # widening the matrix: chromadb and its ONNX model are a heavier install than
    # the core package, and nobody using the MCP server should pay for them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,vector]"
      - name: Retrieval tests
        run: pytest -q tests/test_retrieval.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kegg-string-mcp:ci .
      - name: Server speaks MCP over stdio
        # A Dockerfile that is never built rots; one built but never run can still
        # ship broken. This drives a real initialize / tools-list handshake against
        # the container. Piping the requests in with printf does not work: stdin
        # closes before the server answers the second request.
        run: python3 .github/scripts/mcp_smoke.py kegg-string-mcp:ci
