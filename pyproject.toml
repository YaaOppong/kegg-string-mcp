[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kegg-string-mcp"
version = "0.1.0"
description = "MCP server exposing KEGG and STRING as model-callable tools, with provenance on every record"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
kegg-string-mcp = "kegg_string_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kegg_string_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
