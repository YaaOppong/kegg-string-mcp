[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kegg-string-mcp"
version = "0.1.0"
description = "MCP server exposing KEGG and STRING as model-callable tools, with provenance on every record"
requires-python = ">=3.10"
authors = [{name = "Yaa Oppong", email = "25320748+YaaOppong@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.6", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
demo = ["gradio>=5"]

[project.scripts]
kegg-string-mcp = "kegg_string_mcp.server:main"
gar = "kegg_string_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kegg_string_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/kegg_string_mcp/evaluate/gold_mtu.json" = "kegg_string_mcp/evaluate/gold_mtu.json"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
